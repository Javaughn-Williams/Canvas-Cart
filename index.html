<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=./codes/index.html" />
    <title>Redirecting…</title>
    <script>
      // JavaScript fallback to immediately replace location (avoids adding to history)
      (function () {
        var dest = "./codes/index.html";
        try {
          location.replace(dest);
        } catch (e) {
          location.href = dest;
        }
      })();
    </script>
  </head>
  <body>
    <p>
      Redirecting to the codes index... If you are not redirected automatically,
      <a href="./codes/index.html">click here</a>.
    </p>
  </body>
</html>
